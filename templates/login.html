{% extends "base.html" %}

{% block title %}Sign In | PrepAI Portal{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6 col-lg-5 col-xl-4">
    <div class="portal-card p-4 shadow-sm border">
      <div class="text-center mb-4">
        <div class="stat-icon primary mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.5rem;">
          <i class="bi bi-box-arrow-in-right"></i>
        </div>
        <h4 class="fw-bold mb-1">Student & Job Seeker Sign In</h4>
        <p class="text-muted small">Access your dashboard, AI mock interviews, and experiences</p>
      </div>

      <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="mb-3">
          <label for="email" class="form-label fw-semibold small">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control border-start-0" id="email" name="email" value="{{ email or '' }}" placeholder="student@example.com" required autofocus>
          </div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label fw-semibold small">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="Enter your password" required>
          </div>
        </div>

        <div class="d-grid mt-4">
          <button type="submit" class="btn btn-portal-primary py-2 fw-semibold">
            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Account
          </button>
        </div>
      </form>

      <div class="text-center mt-4 pt-3 border-top small text-muted">
        Don't have an account? 
        <a href="{{ url_for('auth.register') }}" class="fw-semibold text-primary text-decoration-none">Create an Account</a>
      </div>

      <div class="text-center mt-2 small">
        <a href="{{ url_for('admin.login') }}" class="text-secondary text-decoration-none">
          <i class="bi bi-shield-lock me-1"></i> Administrator Access
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
