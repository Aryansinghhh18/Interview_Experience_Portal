{% extends "base.html" %}

{% block title %}Create Account | PrepAI Portal{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-7 col-lg-6 col-xl-5">
    <div class="portal-card p-4 shadow-sm border">
      <div class="text-center mb-4">
        <div class="stat-icon primary mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.5rem;">
          <i class="bi bi-person-plus-fill"></i>
        </div>
        <h4 class="fw-bold mb-1">Create Your Account</h4>
        <p class="text-muted small">Join students and developers preparing for tech interviews</p>
      </div>

      <form method="POST" action="{{ url_for('auth.register') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="mb-3">
          <label for="name" class="form-label fw-semibold small">Full Name</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control border-start-0" id="name" name="name" value="{{ name or '' }}" placeholder="John Doe" required autofocus>
          </div>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label fw-semibold small">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control border-start-0" id="email" name="email" value="{{ email or '' }}" placeholder="student@example.com" required>
          </div>
          <div class="form-text">We'll never share your email with third parties.</div>
        </div>

        <div class="row mb-3">
          <div class="col-md-6 mb-3 mb-md-0">
            <label for="password" class="form-label fw-semibold small">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="Min 6 characters" required>
            </div>
          </div>
          <div class="col-md-6">
            <label for="confirm_password" class="form-label fw-semibold small">Confirm Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock-fill"></i></span>
              <input type="password" class="form-control border-start-0" id="confirm_password" name="confirm_password" placeholder="Re-type password" required>
            </div>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold small">Primary Profile Status</label>
          <div class="d-flex gap-4">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="role" id="role_student" value="student" checked>
              <label class="form-check-label small" for="role_student">
                Student / Fresher
              </label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="role" id="role_user" value="user">
              <label class="form-check-label small" for="role_user">
                Experienced Professional
              </label>
            </div>
          </div>
        </div>

        <div class="d-grid mt-4">
          <button type="submit" class="btn btn-portal-primary py-2 fw-semibold">
            <i class="bi bi-check2-circle me-1"></i> Register Free Account
          </button>
        </div>
      </form>

      <div class="text-center mt-4 pt-3 border-top small text-muted">
        Already have an account? 
        <a href="{{ url_for('auth.login') }}" class="fw-semibold text-primary text-decoration-none">Sign In</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
